<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <title>サンプルプロジェクトの確認</title>
  <style>
    body { margin: 0; padding: 2rem 1.25rem; background: #f5f8fc; color: #10233f; font-family: system-ui, sans-serif; }
    main { width: min(44rem, 100%); margin: auto; }
    .status { display: inline-block; padding: .35rem .65rem; border-radius: 99px; background: #e8f7ee; color: #167347; font-weight: 700; }
    section { margin-top: 1rem; padding: 1.1rem; border: 1px solid #dce6f1; border-radius: 1rem; background: white; }
    h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); line-height: 1.3; text-wrap: balance; }
    li { margin: .55rem 0; }
  </style>
</head>
<body>
  <main>
    <span class="status">実装完了</span>
    <h1>サンプルプロジェクトの確認</h1>
    <p>これはHTML共有くんに同梱された架空のサンプルです。</p>
    <section>
      <h2>今回の変更</h2>
      <ul>
        <li>検索画面の読み込み時間を短縮</li>
        <li>スマートフォンの余白を調整</li>
        <li>自動テストを3件追加</li>
      </ul>
    </section>
  </main>
</body>
</html>
